<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Eye Tracking Reading System</title>

<style>

body{
  margin:0;
  overflow:hidden;
  background:#f0f0f0;
}

/* ===== 視線UI ===== */

#gaze{
  position:fixed;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:9999;
  display:none;
}

/* 薄い大きい円 */
#halo{
  position:absolute;
  width:120px;
  height:120px;
  background:rgba(255,0,0,0.15);
  border-radius:50%;
  transform:translate(-50%,-50%);
}

/* 中央赤点 */
#dot{
  position:absolute;
  width:18px;
  height:18px;
  background:red;
  border-radius:50%;
  transform:translate(-50%,-50%);
}

/* ===== ページ表示 ===== */

#page{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:40px;
  font-weight:bold;
}

/* ===== キャリブレーション ===== */

#calibration-overlay{
  position:fixed;
  width:100vw;
  height:100vh;
  background:rgba(255,255,255,0.9);
  z-index:9000;
}

#instruction{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  font-size:18px;
}

.cal-point{
  position:absolute;
  width:30px;
  height:30px;
  background:#007bff;
  border-radius:50%;
  cursor:pointer;
  transform:translate(-50%,-50%);
}

</style>
</head>

<body>

<div id="gaze">
<div id="halo"></div>
<div id="dot"></div>
</div>

<div id="page">PAGE 1</div>

<div id="calibration-overlay">

<div id="instruction">
青い丸を見ながら<br>
それぞれ3回クリックしてください
</div>

<div class="cal-point" style="top:10%;left:10%"></div>
<div class="cal-point" style="top:10%;left:50%"></div>
<div class="cal-point" style="top:10%;left:90%"></div>

<div class="cal-point" style="top:50%;left:10%"></div>
<div class="cal-point" style="top:50%;left:50%"></div>
<div class="cal-point" style="top:50%;left:90%"></div>

<div class="cal-point" style="top:90%;left:10%"></div>
<div class="cal-point" style="top:90%;left:50%"></div>
<div class="cal-point" style="top:90%;left:90%"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/webgazer@2.1.0/dist/webgazer.min.js"></script>

<script>

const gaze = document.getElementById("gaze")
const overlay = document.getElementById("calibration-overlay")
const points = document.querySelectorAll(".cal-point")

const pageText = document.getElementById("page")

/* ===== 視線スムージング ===== */

let smoothX = window.innerWidth/2
let smoothY = window.innerHeight/2

let gazeHistory=[]
const historyLength=5

const baseSmooth=0.1

/* ===== ページ管理 ===== */

let page=1

function nextPage(){

page++

pageText.innerText="PAGE "+page

}
function prevPage(){
page--
if(page < 1) page = 1
pageText.innerText = "PAGE " + page
}

/* ===== 左下判定 ===== */

let gazeStart = null
let gazeStartPrev = null
const holdTime = 1000 // 2秒

function checkPageTurn(x, y){

const cellWidth = window.innerWidth / 4
const cellHeight = window.innerHeight / 4

const col = Math.floor(x / cellWidth)
const row = Math.floor(y / cellHeight)

const cell = row * 4 + col

// 左下2マス (12,13)
if(cell === 8 || cell === 12){

if(!gazeStart){
gazeStart = Date.now()
}

if(Date.now() - gazeStart > holdTime){

nextPage()
gazeStart = null

}

}else{

gazeStart = null

}
/* ===== 前ページ ===== */

if(cell === 15){

if(!gazeStartPrev){
gazeStartPrev = Date.now()
}

if(Date.now() - gazeStartPrev > holdTime){
prevPage()
gazeStartPrev = null
}

}else{
gazeStartPrev = null
}



}

/* ===== WebGazer ===== */

window.onload=async function(){

webgazer.clearData()

await webgazer
.setRegression('ridge')
.setGazeListener(function(data){

if(!data) return

const x=data.x
const y=data.y

/* 履歴 */

gazeHistory.push({x,y})

if(gazeHistory.length>historyLength){

gazeHistory.shift()

}

/* 移動平均 */

let avgX=0
let avgY=0

gazeHistory.forEach(p=>{
avgX+=p.x
avgY+=p.y
})

avgX/=gazeHistory.length
avgY/=gazeHistory.length

/* サッカード */

const dx=avgX-smoothX
const dy=avgY-smoothY

const dist=Math.sqrt(dx*dx+dy*dy)

let smooth=baseSmooth

if(dist>100){

smooth=0.4
gazeHistory=[]

}

/* 更新 */

smoothX+=dx*smooth
smoothY+=dy*smooth

/* UI */

gaze.style.left=smoothX+"px"
gaze.style.top=smoothY+"px"

/* ページ判定 */

checkPageTurn(smoothX,smoothY)

})
.begin()

webgazer.showPredictionPoints(false)

webgazer.showVideo(true)

webgazer.showFaceOverlay(true)

webgazer.showFaceFeedbackBox(true)

}

/* ===== キャリブレーション ===== */

let completed=0

points.forEach(point=>{

let clickCount=0

point.addEventListener("click",function(e){

clickCount++

webgazer.recordScreenPosition(e.clientX,e.clientY,'click')

if(clickCount>=3){

point.style.display="none"

completed++

if(completed===points.length){

endCalibration()

}

}else{

point.style.opacity=1-(clickCount*0.3)

}

})

})

function endCalibration(){

overlay.style.display="none"

gaze.style.display="block"

}

/* ===== 継続学習 ===== */

document.addEventListener("click",function(e){

if(overlay.style.display==="none"){

webgazer.recordScreenPosition(e.clientX,e.clientY,'click')

}

})

</script>

</body>
</html>
