<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>視線読書ビューア</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- タイトル -->
  <h1>視線読書ビューア</h1>

  <!-- 本文表示エリア -->
  <div id="book-area">
    <p id="page-text">
      ここに本文が表示されます
    </p>
  </div>

  <!-- 操作エリア -->
  <div id="controls">

    <!-- 前へボタン -->
    <button id="prev-btn">前へ</button>

    <!-- ページ番号 -->
    <span id="page-indicator">
      1 / 5
    </span>

    <!-- 次へボタン -->
    <button id="next-btn">次へ</button>

  </div>

  <script src="script.js"></script>

</body>
</html>
