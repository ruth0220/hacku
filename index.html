<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>読書ビューア</title>
  <link rel = "stylesheet" href="style.css">
</head>

<body>
  <h1>読書ビューア</h1>

  <div id="book-area">
    <!-- 左ページ -->
    <div class= "page">
      <p id = "page-left"></p>
      <!-- 左下の番号 -->
      <span id = "page-count-left" class = "page-number left-number"></span>
    </div>

  <!-- 右ページ -->
  <div class = "page">
    <p id = "page-right"></p>
    <!-- 右下の番号 -->
      <span id = "page-count-right" class = "page-number right-number"></span>
  </div>

  </div>

  <div id="control">
    <button id="prev-btn">前へ</button>
    <!-- 改行しないので -->

    <button id="next-btn">次へ</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
